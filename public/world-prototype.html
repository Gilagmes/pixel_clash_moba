<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pixel Clash — Living World</title>
<style>
:root{--glass:rgba(9,14,19,.82);--line:rgba(255,255,255,.13);--text:#f4f7fb;--muted:#9ca9b8;--accent:#70d8ff;--danger:#ff6073;--good:#79e39a;--gold:#e9c15b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071017;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#scene{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;gap:10px;align-items:flex-start}.brand,.panel,.objective,.nav,.inspect,.toast{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);box-shadow:0 12px 35px #0007;border-radius:16px}.brand{padding:11px 14px;min-width:165px}.brand b{font-size:14px;letter-spacing:.12em}.brand small{display:block;color:var(--muted);margin-top:3px}.resources{display:flex;gap:7px;flex-wrap:wrap}.resource{padding:8px 10px;border-radius:12px;background:#0b121bcc;border:1px solid var(--line);font-weight:750;font-size:13px}.objective{margin:auto auto 10px;padding:10px 13px;align-self:center;font-size:13px}.objective b{color:var(--good)}.bottom{display:flex;align-items:end;justify-content:space-between;gap:10px}.panel{pointer-events:auto;padding:10px}.hero{display:flex;align-items:center;gap:10px;min-width:220px}.portrait{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#32485a,#0e1824);display:grid;place-items:center;font-size:25px;border:1px solid #ffffff18}.hero b{display:block;font-size:13px}.hero small{display:block;color:var(--muted);margin-top:2px}.bar{height:6px;width:145px;background:#111a23;border-radius:8px;overflow:hidden;margin-top:6px}.hp{height:100%;width:82%;background:#65e59a}.xp{height:100%;width:36%;background:#6fcfff}.actions{display:flex;gap:8px}.action{width:52px;height:52px;border:1px solid var(--line);border-radius:15px;background:var(--glass);color:#fff;font-weight:900;font-size:18px;box-shadow:0 8px 20px #0005}.action:active{transform:scale(.94)}.nav{pointer-events:auto;display:flex;gap:5px;padding:6px}.nav button{border:0;background:transparent;color:#aeb9c6;border-radius:12px;padding:9px 11px;font-size:11px;font-weight:800}.nav button.active{background:#ffffff12;color:#fff}
.inspect{position:fixed;right:12px;top:86px;width:min(300px,calc(100vw - 24px));padding:13px;display:none;pointer-events:auto}.inspect.show{display:block}.inspect .title{font-weight:900;font-size:15px}.inspect .sub{color:var(--muted);font-size:12px;margin-top:3px}.inspect .stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.stat{background:#ffffff08;border:1px solid #ffffff0d;border-radius:10px;padding:8px;font-size:11px}.stat b{display:block;font-size:13px;margin-top:2px}.raid{margin-top:10px;width:100%;border:0;border-radius:11px;padding:11px;background:linear-gradient(135deg,#a04c58,#713744);color:white;font-weight:900}.close{float:right;border:0;background:transparent;color:#aeb9c6;font-size:18px}.toast{position:fixed;left:50%;bottom:102px;transform:translateX(-50%) translateY(15px);opacity:0;padding:10px 14px;font-size:12px;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.legend{position:fixed;top:72px;left:12px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 11px;font-size:11px;color:#c4ced8;line-height:1.6;pointer-events:none}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.blue{background:#63c9ff}.green{background:#72df91}.red{background:#ff6577}.gold{background:#f2c45c}
@media(max-width:650px){.resources{max-width:205px}.legend{display:none}.objective{font-size:12px;margin-bottom:8px}.hero{min-width:185px}.nav button{padding:8px 8px}.action{width:48px;height:48px}.inspect{top:76px}}
</style>
</head>
<body>
<div id="scene"></div>
<div class="legend"><span class="dot blue"></span>база&nbsp;&nbsp;<span class="dot green"></span>работники<br><span class="dot gold"></span>армия&nbsp;&nbsp;<span class="dot red"></span>зомби</div>
<div id="inspect" class="inspect"><button class="close" id="closeInspect">×</button><div class="title" id="inspectTitle">Объект</div><div class="sub" id="inspectSub">Нажмите на объект</div><div class="stats" id="inspectStats"></div><button class="raid" id="raidBtn" style="display:none">⚔️ ОТПРАВИТЬ ОТРЯД В РЕЙД</button></div>
<div id="toast" class="toast"></div>
<div class="hud"><div class="top"><div class="brand"><b>PIXEL CLASH</b><small>ЖИВОЙ МИР · РАЙОН 01</small></div><div class="resources"><div class="resource">🪵 1,240</div><div class="resource">🥫 680</div><div class="resource">🔩 315</div><div class="resource">⛽ 94</div></div></div><div class="objective">РАЗВЕДКА: <b>ЗАПАДНЫЙ ЛЕС</b> · угроза 2/5 · 1.8 км</div><div class="bottom"><div class="panel hero"><div class="portrait">🧭</div><div><b>Капитан Алекс · ур. 7</b><small>Командир разведчиков</small><div class="bar"><div class="hp"></div></div><div class="bar"><div class="xp"></div></div></div></div><div class="actions"><button class="action" id="mapBtn" title="Карта">🗺️</button><button class="action" id="raidQuick" title="Рейд">⚔️</button><button class="action" id="baseQuick" title="База">🏠</button></div><div class="nav"><button class="active">МИР</button><button>БАЗА</button><button>ГЕРОИ</button><button>АРМИЯ</button></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x09131b);scene.fog=new THREE.Fog(0x09131b,62,150);
const camera=new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,240);camera.position.set(37,34,41);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.getElementById('scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,5);controls.enableDamping=true;controls.dampingFactor=.075;controls.minDistance=22;controls.maxDistance=76;controls.maxPolarAngle=Math.PI*.46;controls.minPolarAngle=.48;controls.panSpeed=.7;
scene.add(new THREE.HemisphereLight(0xa8d9ff,0x24351f,2.0));const sun=new THREE.DirectionalLight(0xffd9aa,3.5);sun.position.set(25,48,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-65;sun.shadow.camera.right=65;sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;scene.add(sun);
const world=new THREE.Group();scene.add(world);const interactive=[];const people=[];const roads=[];const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function addMesh(g,geo,material,pos=[0,0,0],rot=[0,0,0],name=''){const m=new THREE.Mesh(geo,material);m.position.set(...pos);m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;m.userData.name=name;g.add(m);return m}
function box(g,x,y,z,sx,sy,sz,c,name=''){return addMesh(g,new THREE.BoxGeometry(sx,sy,sz),mat(c),[x,y,z],[0,0,0],name)}
const ground=addMesh(world,new THREE.PlaneGeometry(160,160),mat(0x2d4731),[0,0,0],[-Math.PI/2,0,0]);ground.receiveShadow=true;
// terrain patches for visual depth
for(let i=0;i<22;i++){const p=addMesh(world,new THREE.CircleGeometry(2+Math.random()*5,16),mat(i%2?0x304d32:0x29432e),[Math.random()*110-55,.012,Math.random()*110-55],[-Math.PI/2,0,0]);p.scale.y=.55}
function road(x,z,w,d,vertical=true){const g=new THREE.Group();const r=box(g,x,.04,z,w,.08,d,0x454743);const count=Math.floor((vertical?d:w)/4);for(let i=-count;i<=count;i++){const mark=vertical?box(g,x,.09,z+i*4,.22,.025,1.6,0xc8b77b):box(g,x+i*4,.09,z,1.6,.025,.22,0xc8b77b)}world.add(g);roads.push(g)}
road(0,0,10,118,true);road(-24,8,5,54,true);road(20,-8,5,48,true);road(0,18,46,5,false);
// base platform and perimeter
const base= new THREE.Group();base.userData={type:'building',title:'Главная база',sub:'Укреплённый командный центр',stats:[['Гарнизон','24 бойца'],['Статус','Защищена'],['Уровень','4']]};world.add(base);interactive.push(base);
box(base,0,.18,17,28,.32,23,0x1c3027);box(base,-2,.35,17,10,.32,7,0x263c34);
// HQ detailed
const hq=new THREE.Group();hq.userData=base.userData;base.add(hq);box(hq,-2,2.1,17,10,3.6,7,0x6f7b76);box(hq,-2,4.35,17,7.2,1.0,5.7,0x34474c);box(hq,-2,6.3,17,4.4,3.0,4.1,0x536f77);box(hq,-2,8.15,17,2.5,.65,2.5,0x94aeb0);box(hq,-2,8.6,17,.22,1.8,.22,0x2b3338);const flag=addMesh(hq,new THREE.BoxGeometry(1.2,.65,.06),mat(0x65d6ff),[-1.42,9.0,17.0]);flag.rotation.y=.15;
for(const z of [13.8,20.2]){box(hq,-7.15,2.1,z,.3,3.5,.3,0x28343a);box(hq,3.15,2.1,z,.3,3.5,.3,0x28343a)}
// buildings
function building(x,z,w,d,h,c,title,sub,stats){const g=new THREE.Group();g.position.set(x,0,z);g.userData={type:'building',title,sub,stats};world.add(g);interactive.push(g);box(g,0,h/2,0,w,h,d,c);box(g,0,h+.16,0,w+.35,.35,d+.35,0x3a3029);box(g,0,h+.38,0,w*.78,.18,d*.78,0x5c4739);for(const xx of [-w*.28,w*.28])for(const zz of [-d/2-.02,d/2+.02]){const win=box(g,xx,h*.56,zz,.7,.65,.08,0x7fc1cb);win.material.emissive=new THREE.Color(0x183b44);win.material.emissiveIntensity=1.2}return g}
building(8,22,7,6,3.4,0x705846,'Склад','Хранение припасов',[['Запасы','+18/ч'],['Вместимость','2,400'],['Состояние','96%']]);
building(-10,22,6,5,2.8,0x66503e,'Мастерская','Ремонт и производство',[['Инженеры','3'],['Ремонт','+8/ч'],['Уровень','3']]);
building(10,12,4.6,4.6,4.3,0x405b65,'Дозорная башня','Контроль периметра',[['Дальность','1.4 км'],['Угроза','низкая'],['Состояние','100%']]);
// farm beds
const farm=new THREE.Group();farm.position.set(-2,0,12.5);farm.userData={type:'building',title:'Ферма',sub:'Выращивание продовольствия',stats:[['Рабочие','2'],['Урожай','+12/ч'],['Состояние','88%']]};world.add(farm);interactive.push(farm);for(let i=0;i<5;i++){const x=-8+i*3;box(farm,x,0.28,0,.8,.45,5.7,0x3e6940);for(let j=0;j<4;j++)addMesh(farm,new THREE.ConeGeometry(.18,.7,5),mat(0x76ad4e),[x+(Math.random()-.5)*.25,.72,-1.9+j*1.25])}
// fence
for(let i=-13;i<=13;i+=2){box(world,i,.72,6,.13,1.45,.13,0x87918a);box(world,i,.72,28,.13,1.45,.13,0x87918a)}
for(let x of [-13,13]){box(world,x,.72,17,.13,1.45,.13,0x87918a);box(world,x,.72,25,.13,1.45,.13,0x87918a)}
// lights
const lights=[];for(const x of [-12,12]){const pole=box(world,x,2.4,7,.16,4.8,.16,0x3d464b);const bulb=addMesh(world,new THREE.SphereGeometry(.34,12,8),new THREE.MeshStandardMaterial({color:0xffd991,emissive:0xffa84d,emissiveIntensity:3}),[x,5,7]);const pl=new THREE.PointLight(0xffb45f,1.1,13,2);pl.position.set(x,4.8,7);world.add(pl);lights.push(pl)}
// forest
function tree(x,z,s=1){const g=new THREE.Group();const trunk=addMesh(g,new THREE.CylinderGeometry(.24*s,.38*s,2.5*s,7),mat(0x59432f),[0,1.25*s,0]);for(let i=0;i<3;i++)addMesh(g,new THREE.ConeGeometry((1.75-i*.2)*s,3.1*s,8),mat(i===0?0x315f39:0x3e7645),[0,(2.35+i*1.0)*s,0]);g.position.set(x,0,z);world.add(g)}
for(let i=0;i<105;i++){const a=Math.random()*Math.PI*2,r=30+Math.random()*43,x=Math.cos(a)*r,z=Math.sin(a)*r;if(Math.abs(x)<17&&z>4)continue;tree(x,z,.65+Math.random()*.65)}
// river + bridge
const river=addMesh(world,new THREE.PlaneGeometry(13,150),new THREE.MeshStandardMaterial({color:0x245f75,roughness:.2,metalness:.05}),[31,.018,0],[-Math.PI/2,0,0]);for(let i=-55;i<55;i+=4)box(world,28.5,.08,i,4,.1,.3,0x3b7987);for(let x=-5;x<=5;x+=2)box(world,31,0.18,18,x?1.8:1.8,.32,.9,0x5d5141);
// human-like stylized units
function human(x,z,color,kind,title){const g=new THREE.Group();g.position.set(x,0,z);g.userData={type:kind==='zombie'?'zombie':kind==='soldier'?'army':'worker',title,sub:kind==='worker'?'Житель базы':kind==='soldier'?'Боец гарнизона':'Заражённый',stats:kind==='worker'?[['Профессия',title],['Усталость',Math.floor(20+Math.random()*45)+'%'],['Опыт','ур. '+(2+Math.floor(Math.random()*4))]]:kind==='soldier'?[['Роль','Разведчик'],['Здоровье','100%'],['Уровень','5']]:[['Угроза','Средняя'],['Здоровье','100%'],['Тип','Обычный']]};interactive.push(g);const body=addMesh(g,new THREE.CapsuleGeometry(.42,.95,5,8),mat(color),[0,1.12,0]);const head=addMesh(g,new THREE.SphereGeometry(.42,12,8),mat(kind==='zombie'?0x86a77f:0xd3a17b),[0,2.05,0]);if(kind==='soldier'){addMesh(g,new THREE.BoxGeometry(.16,.16,1.55),mat(0x171d22),[.5,1.35,.12],[0,0,-.2]);addMesh(g,new THREE.CylinderGeometry(.3,.3,.12,8),mat(0x2f3437),[0,2.42,0])}if(kind==='zombie'){addMesh(g,new THREE.ConeGeometry(.13,.45,6),mat(0x5d705a),[.38,1.35,0],[0,0,-.7])}people.push(g);world.add(g);return g}
const workers=[[-8,18,'Строитель'],[3,22,'Снабженец'],[6,15,'Фермер'],[-7,25,'Инженер'],[1,12,'Механик']];workers.forEach(p=>human(p[0],p[1],0x66c88d,'worker',p[2]));for(let i=0;i<6;i++)human(14+i*.9,5+i*.5,0xd3b45f,'soldier','Разведчик '+(i+1));
const zombies=[];for(let i=0;i<11;i++){const a=Math.PI*.72+Math.random()*.65,r=30+Math.random()*15;zombies.push(human(Math.cos(a)*r,Math.sin(a)*r,0xb05d68,'zombie','Зомби '+(i+1)))}
// POIs
function marker(x,z,c,title,sub,stats){const g=new THREE.Group();g.position.set(x,0,z);g.userData={type:'poi',title,sub,stats};interactive.push(g);addMesh(g,new THREE.TorusGeometry(1.35,.11,8,32),new THREE.MeshBasicMaterial({color:c}),[0,.18,0],[Math.PI/2,0,0]);addMesh(g,new THREE.ConeGeometry(.25,.85,6),new THREE.MeshBasicMaterial({color:c}),[0,.72,0]);return g}
const poiWest=marker(-24,-24,0xffc857,'Западный лес','Точка разведки · 1.8 км',[['Угроза','2 / 5'],['Добыча','Высокая'],['Отряд','6 бойцов']]);marker(21,-29,0x6acbff,'Старая АЗС','Топливо и запчасти',[['Угроза','3 / 5'],['Топливо','+24'],['Дистанция','2.1 км']]);marker(40,17,0xff5d73,'Заражённый район','Гнездо зомби',[['Угроза','5 / 5'],['Босс','Возможен'],['Дистанция','3.4 км']]);
// base beacon
const beacon=addMesh(world,new THREE.CylinderGeometry(.24,.24,7,12),new THREE.MeshBasicMaterial({color:0x6bd6ff,transparent:true,opacity:.38}),[-2,5,17]);
// raid squad path
const squad=new THREE.Group();world.add(squad);const raidUnits=[];for(let i=0;i<6;i++){const u=human(0,0,0xd3b45f,'soldier','Рейдовый боец');u.visible=false;raidUnits.push(u);squad.add(u)}let raid={active:false,p:0};
function startRaid(target=poiWest){if(raid.active)return;raid.active=true;raid.p=0;toast('Отряд отправился в рейд');const start=new THREE.Vector3(14,0,5),end=target.position.clone();raidUnits.forEach((u,i)=>{u.visible=true;u.position.set(start.x+(i%3)*.8,start.y,start.z+Math.floor(i/3)*.8)});raid.target=end}
function updateRaid(dt){if(!raid.active)return;raid.p+=dt*.055;const p=Math.min(raid.p,1);const path=new THREE.Vector3().lerpVectors(new THREE.Vector3(14,0,5),raid.target,p);raidUnits.forEach((u,i)=>{u.position.x=path.x+(i%3)*.75;u.position.z=path.z+Math.floor(i/3)*.75;u.position.y=Math.sin(performance.now()*.008+i)*.025});if(p>=1){raid.active=false;toast('Рейд завершён · добыча +240');setTimeout(()=>raidUnits.forEach(u=>u.visible=false),900)}}
// picking / panels
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();const inspect=document.getElementById('inspect'),titleEl=document.getElementById('inspectTitle'),subEl=document.getElementById('inspectSub'),statsEl=document.getElementById('inspectStats'),raidBtn=document.getElementById('raidBtn');let selected=null;
function showInfo(obj){selected=obj;const d=obj.userData||{};titleEl.textContent=d.title||'Объект';subEl.textContent=d.sub||'';statsEl.innerHTML=(d.stats||[]).map(s=>`<div class="stat">${s[0]}<b>${s[1]}</b></div>`).join('');raidBtn.style.display=d.type==='poi'?'block':'none';inspect.classList.add('show')}
function pick(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(interactive,true);if(!hits.length)return;let o=hits[0].object;while(o.parent&&!interactive.includes(o))o=o.parent;showInfo(o)}
renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-(window.__sx||e.clientX))<8&&Math.abs(e.clientY-(window.__sy||e.clientY))<8)pick(e)});renderer.domElement.addEventListener('pointerdown',e=>{window.__sx=e.clientX;window.__sy=e.clientY});
document.getElementById('closeInspect').onclick=()=>inspect.classList.remove('show');raidBtn.onclick=()=>startRaid(selected);document.getElementById('raidQuick').onclick=()=>startRaid(poiWest);document.getElementById('mapBtn').onclick=()=>toast('Карта района открыта');document.getElementById('baseQuick').onclick=()=>{controls.target.set(0,0,17);camera.position.set(31,28,34);toast('Камера наведена на базу')};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2200)}
let t=0,last=performance.now();function animate(now=performance.now()){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;people.forEach((g,i)=>{g.position.y=Math.sin(t*2+i)*.018;if(i<5&&!raid.active){g.position.x+=Math.sin(t*.5+i)*.0012;g.position.z+=Math.cos(t*.65+i)*.0012}});beacon.material.opacity=.24+.14*Math.sin(t*2);lights.forEach((l,i)=>l.intensity=1.0+.2*Math.sin(t*2+i));updateRaid(dt);controls.update();renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script>
</body>
</html>
